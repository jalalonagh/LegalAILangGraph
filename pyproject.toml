[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "legal-ai"
version = "0.1.0"
description = "Production-grade Legal AI Assistant platform powered by LangGraph"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Legal AI Team" }]
keywords = ["legal", "ai", "langgraph", "rag", "fastapi", "law"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core web framework
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "gunicorn>=23.0.0,<24.0",
    # Async HTTP
    "httpx>=0.27.0,<1.0",
    "httpx[http2]>=0.27.0,<1.0",
    # Pydantic
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "pydantic[email]>=2.9.0,<3.0",
    # Database
    "sqlalchemy>=2.0.35,<3.0",
    "asyncpg>=0.29.0,<1.0",
    "alembic>=1.13.0,<2.0",
    "psycopg2-binary>=2.9.0,<3.0",
    # Redis
    "redis>=5.0.0,<6.0",
    "redis.asyncio>=5.0.0,<6.0",
    # LangChain & LangGraph
    "langchain>=0.3.0,<1.0",
    "langchain-core>=0.3.0,<1.0",
    "langchain-community>=0.3.0,<1.0",
    "langchain-text-splitters>=0.3.0,<1.0",
    "langgraph>=0.2.0,<1.0",
    "langgraph-checkpoint-postgres>=0.10.0,<1.0",
    "langgraph-runtime>=0.1.0,<1.0",
    # Embeddings / Vectors
    "sentence-transformers>=3.0.0,<4.0",
    "qdrant-client>=1.10.0,<2.0",
    "rank-bge>=0.1.0,<1.0",
    # Document parsing
    "python-docx>=1.0.0,<2.0",
    "python-pptx>=0.6.23,<1.0",
    "openpyxl>=3.1.0,<4.0",
    "python-magic>=0.4.27,<1.0",
    "pdfplumber>=0.11.0,<1.0",
    "PyPDF2>=3.0.0,<4.0",
    "pdf2image>=1.16.0,<2.0",
    "pytesseract>=0.3.10,<1.0",
    "lxml>=5.0.0,<6.0",
    "beautifulsoup4>=4.12.0,<5.0",
    "markdownify>=0.13.0,<1.0",
    # OCR
    "ocrmypdf>=16.0.0,<17.0",
    # Security
    "python-jose[cryptography]>=3.3.0,<4.0",
    "cryptography>=43.0.0,<44.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bleach>=3.19.0,<4.0",
    "html5lib>=1.1,<2.0",
    # Observability
    "opentelemetry-api>=1.26.0,<2.0",
    "opentelemetry-sdk>=1.26.0,<2.0",
    "opentelemetry-exporter-otlp>=1.26.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0,<1.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.47b0,<1.0",
    "opentelemetry-instrumentation-requests>=0.47b0,<1.0",
    "prometheus-client>=0.20.0,<1.0",
    # Rate limiting
    "slowapi>=0.1.9,<1.0",
    "limits>=3.13.0,<4.0",
    # YAML / config
    "pyyaml>=6.0.0,<7.0",
    "tomli>=2.0.0,<3.0",
    # Utilities
    "python-multipart>=0.0.9",
    "tenacity>=9.0.0,<10.0",
    "structlog>=24.0.0,<25.0",
    "aiofiles>=24.0.0,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-mock>=3.14.0,<4.0",
    "pytest-xdist>=3.6.0,<4.0",
    "mypy>=1.13.0,<2.0",
    "ruff>=0.7.0,<1.0",
    "pre-commit>=3.5.0,<4.0",
    "httpx>=0.27.0,<1.0",
    "faker>=30.0.0,<31.0",
]
all = [
    "legal-ai[dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "migrations",
    ".venv",
    "__pycache__",
    ".git",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "PL",  # pylint
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR0917", # too many positional arguments
    "PLR2902", # too many positional
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "B904",   # raise from
    "B008",   # function call in default argument
]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2914", "PLR2905"]
"migrations/**" = ["S101", "PLR2914", "PLR2905"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-endings = "lf"

[tool.mypy]
python_version = "3.12"
module = "app"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
no_implicit_reexport = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-ra",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "graph: LangGraph tests",
    "rag: RAG tests",
    "api: API tests",
    "security: Security tests",
    "evaluation: Evaluation tests",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.alembic]
script_location = "migrations"
prepend_sys_path = ["."]
